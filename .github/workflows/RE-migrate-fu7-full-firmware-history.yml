name: RE Migrate FU7 Full Firmware History

on:
  push:
    branches: [cudy-dev-beta]
    paths:
      - ".github/workflows/RE-migrate-fu7-full-firmware-history.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cudy-dev-beta
          fetch-depth: 0

      - name: Copy firmware-project history from Website-downloader
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/website-downloader
          git clone --depth 1 --branch fu_7-cudy-cdn-index             https://github.com/diablomike20/Website-downloader.git /tmp/website-downloader

          mkdir -p legacy/FU7/full-history

          if [ -d /tmp/website-downloader/handoff/Firmware-Unlock-8 ]; then
            rm -rf legacy/FU7/full-history/Firmware-Unlock-8
            cp -a /tmp/website-downloader/handoff/Firmware-Unlock-8               legacy/FU7/full-history/Firmware-Unlock-8
          fi

          python3 - <<'PY'
          import pathlib,re,shutil
          src=pathlib.Path("/tmp/website-downloader")
          dst=pathlib.Path("legacy/FU7/full-history/root-results")
          dst.mkdir(parents=True,exist_ok=True)
          rx=re.compile(r"(zerotier|firmware|cudy-dev|beta|p2|wr1300|wr3000)",re.I)
          for p in src.iterdir():
              if p.name in {".git","handoff","scripts",".github"}: continue
              if rx.search(p.name):
                  q=dst/p.name
                  if q.exists():
                      if q.is_dir(): shutil.rmtree(q)
                      else: q.unlink()
                  if p.is_dir(): shutil.copytree(p,q)
                  elif p.is_file(): shutil.copy2(p,q)
          PY

      - name: Commit full migrated firmware history
        shell: bash
        run: |
          set -e
          git config user.name "OpenCudy Migration Bot"
          git config user.email "73985391+diablomike20@users.noreply.github.com"
          git add legacy/FU7/full-history
          git diff --cached --quiet && exit 0
          git commit -m "RE: archive full FU7 firmware history"
          git push origin HEAD:cudy-dev-beta
