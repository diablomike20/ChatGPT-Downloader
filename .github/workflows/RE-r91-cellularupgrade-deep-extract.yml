name: RE R91 CellularUpgrade Deep Extract

on:
  push:
    branches: [cudy-cellular-modem]
    paths:
      - ".github/workflows/RE-r91-cellularupgrade-deep-extract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      R91_SHA: 9d27fb4535dff565cd8bb632933dc8a583f514bfcb2a027c740ddee0bc4f5f13
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cudy-cellular-modem
          fetch-depth: 1

      - name: Install static extraction tools
        shell: bash
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pip file binutils binwalk u-boot-tools mtd-utils device-tree-compiler >/dev/null
          python3 -m pip install --quiet ubi-reader

      - name: Acquire and verify exact R91
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r91
          cp firmware/cudy/cellular-modem/firmware/R91-2.4.23b-20251208-CellularUpgrade.bin /tmp/r91/R91.bin
          test "$(sha256sum /tmp/r91/R91.bin | awk '{print $1}')" = "$R91_SHA"

      - name: Parse container and UBI
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/RE-R91-CELLULARUPGRADE-DEEP-EXTRACT-01"
          mkdir -p "$OUT" /tmp/r91/ubi-images /tmp/r91/fs /tmp/r91/binwalk

          {
            stat -c 'size=%s' /tmp/r91/R91.bin
            sha256sum /tmp/r91/R91.bin
            file -k /tmp/r91/R91.bin || true
            binwalk /tmp/r91/R91.bin || true
          } > "$OUT/RE-R91-BASIC-AND-BINWALK.txt" 2>&1

          # Binwalk proves a FIT/FDT at 0x200800 and a UBI EC header at 0x2008a0.
          dd if=/tmp/r91/R91.bin of=/tmp/r91/R91-fit-tail.bin bs=1 skip=$((0x200800)) status=none
          dd if=/tmp/r91/R91.bin of=/tmp/r91/R91.ubi bs=1 skip=$((0x2008a0)) status=none

          {
            echo "=== FIT/DUMPIMAGE ==="
            dumpimage -l /tmp/r91/R91-fit-tail.bin || true
            echo
            echo "=== FDT HEADER / TREE ==="
            fdtdump /tmp/r91/R91-fit-tail.bin || true
          } > "$OUT/RE-R91-FIT-FDT.txt" 2>&1

          {
            echo "=== UBI FILE ==="
            stat -c 'size=%s' /tmp/r91/R91.ubi
            sha256sum /tmp/r91/R91.ubi
            file -k /tmp/r91/R91.ubi || true
            echo
            echo "=== UBI READER DISPLAY ==="
            ubireader_display_info -v /tmp/r91/R91.ubi || true
          } > "$OUT/RE-R91-UBI-INFO.txt" 2>&1

          ubireader_extract_images -o /tmp/r91/ubi-images /tmp/r91/R91.ubi > "$OUT/RE-R91-UBI-EXTRACT-IMAGES.log" 2>&1 || true

          {
            echo "=== EXTRACTED UBI IMAGES ==="
            find /tmp/r91/ubi-images -type f -printf '%s|%p\n' | sort -n
            echo
            while IFS= read -r f; do
              echo "### $f"
              file -k "$f" || true
              binwalk "$f" || true
            done < <(find /tmp/r91/ubi-images -type f | sort)
          } > "$OUT/RE-R91-UBI-IMAGE-INVENTORY.txt" 2>&1

          # Extract the OpenWrt rootfs volume: the UBI volume itself is SquashFS, not UBIFS.
          ROOTVOL="$(find /tmp/r91/ubi-images -type f -name '*vol-rootfs.ubifs' | head -n1)"
          if [ -n "$ROOTVOL" ] && [ -f "$ROOTVOL" ]; then
            rm -rf /tmp/r91/rootfs-squashfs
            mkdir -p /tmp/r91/rootfs-squashfs
            unsquashfs -f -d /tmp/r91/rootfs-squashfs "$ROOTVOL" > "$OUT/RE-R91-UNSQUASHFS.log" 2>&1 || true
          fi

          # Try UBIFS extraction too for completeness; this is expected to reject the SquashFS rootfs volume.
          for f in /tmp/r91/R91.ubi $(find /tmp/r91/ubi-images -type f | sort); do
            [ -f "$f" ] || continue
            safe="$(basename "$f" | tr -c 'A-Za-z0-9._-' '_')"
            dst="/tmp/r91/fs/$safe"
            rm -rf "$dst"
            ubireader_extract_files -o "$dst" "$f" > "$OUT/RE-R91-FS-$safe.log" 2>&1 || true
          done

          {
            echo "=== EXTRACTED FILESYSTEM TREE ==="
            find /tmp/r91/fs -type f -printf '%s|%p\n' | sort -n
          } > "$OUT/RE-R91-FS-TREE.txt"

          {
            echo "=== HIGH VALUE TEXT HITS ==="
            grep -RInaE --binary-files=without-match               'RG500|RG500U|Quectel|quectel|CellularUpgrade|cellular|modem|upgrade|flash|download|dloader|QDLoader|FDL2?|BSL|ttyUSB|ttyACM|usb5g|pcie|AT\+|gcom|4g|5g|tftp|wget|curl|factory|debug|research|recovery'               /tmp/r91/fs /tmp/r91/rootfs-squashfs 2>/dev/null | head -n 100000 || true
          } > "$OUT/RE-R91-FS-HIGHVALUE-HITS.txt"

          {
            echo "=== HIGH VALUE FILE NAMES ==="
            find /tmp/r91/fs -type f | grep -Ei               'rg500|quectel|cell|modem|upgrade|flash|download|dloader|qdl|fdl|bsl|usb|pcie|gcom|4g|5g|at|factory|debug|recovery' | sort || true
          } > "$OUT/RE-R91-CANDIDATE-FILES.txt"

          # Generic recursive binwalk is supplementary, not authoritative.
          (
            cd /tmp/r91/binwalk
            binwalk -Me --run-as=root /tmp/r91/R91.bin || true
          ) > "$OUT/RE-R91-BINWALK-DEEP.log" 2>&1

          {
            echo "=== BINWALK EXTRACT TREE ==="
            find /tmp/r91/binwalk -type f -printf '%s|%p\n' | sort -n
          } > "$OUT/RE-R91-BINWALK-TREE.txt"

          # Make export readable without modifying source bytes.
          sudo chmod -R a+rX /tmp/r91/fs /tmp/r91/ubi-images /tmp/r91/rootfs-squashfs || true

          # Export extracted trees and UBI volume images for local inspection.
          cp -a /tmp/r91/ubi-images "$OUT/ubi-images"
          cp -a /tmp/r91/fs "$OUT/filesystems-ubireader"
          if [ -d /tmp/r91/rootfs-squashfs ]; then
            cp -a /tmp/r91/rootfs-squashfs "$OUT/rootfs"
          fi
          sudo chmod -R a+rX "$OUT"

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: RE-R91-CELLULARUPGRADE-DEEP-EXTRACT-01
          path: RE-R91-CELLULARUPGRADE-DEEP-EXTRACT-01/
          if-no-files-found: error
          retention-days: 14
