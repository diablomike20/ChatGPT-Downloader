name: TEMP Rename OpenWrt Intermediate Branch Layout

on:
  push:
    branches: [cudy-openwrt-intermediate]
    paths:
      - ".github/workflows/TEMP-rename-openwrt-intermediate.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cudy-openwrt-intermediate
          fetch-depth: 0

      - name: Rename branch-local layout and references
        shell: bash
        run: |
          set -euo pipefail

          if [ -d firmware/cudy/recovery-intermediate ]; then
            mkdir -p firmware/cudy
            mv firmware/cudy/recovery-intermediate firmware/cudy/openwrt-intermediate
          fi

          if [ -f .github/workflows/RE-sync-cudy-recovery-intermediate.yml ]; then
            mv .github/workflows/RE-sync-cudy-recovery-intermediate.yml                .github/workflows/RE-sync-cudy-openwrt-intermediate.yml
          fi

          if [ -f firmware/cudy/openwrt-intermediate/RE-CUDY-RECOVERY-INTERMEDIATE-MANIFEST.csv ]; then
            mv firmware/cudy/openwrt-intermediate/RE-CUDY-RECOVERY-INTERMEDIATE-MANIFEST.csv                firmware/cudy/openwrt-intermediate/RE-CUDY-OPENWRT-INTERMEDIATE-MANIFEST.csv
          fi

          if [ -f firmware/cudy/openwrt-intermediate/RE-CUDY-RECOVERY-INTERMEDIATE-SHA256SUMS.txt ]; then
            mv firmware/cudy/openwrt-intermediate/RE-CUDY-RECOVERY-INTERMEDIATE-SHA256SUMS.txt                firmware/cudy/openwrt-intermediate/RE-CUDY-OPENWRT-INTERMEDIATE-SHA256SUMS.txt
          fi

          python3 - <<'PY'
          from pathlib import Path
          paths = [
              Path(".github/workflows/RE-sync-cudy-openwrt-intermediate.yml"),
              Path("firmware/cudy/openwrt-intermediate/README.md"),
          ]
          for p in paths:
              if not p.exists():
                  continue
              s=p.read_text(encoding="utf-8",errors="ignore")
              s=s.replace("cudy-recovery-intermediate","cudy-openwrt-intermediate")
              s=s.replace("recovery-intermediate","openwrt-intermediate")
              s=s.replace("Recovery Intermediate","OpenWrt Intermediate")
              s=s.replace("recovery / intermediate","OpenWrt / intermediate")
              s=s.replace("recovery/intermediate","OpenWrt/intermediate")
              s=s.replace("RECOVERY-INTERMEDIATE","OPENWRT-INTERMEDIATE")
              p.write_text(s,encoding="utf-8")
          PY

          # This migration workflow is one-shot.
          git rm .github/workflows/TEMP-rename-openwrt-intermediate.yml

          git config user.name "OpenCudy Branch Migration Bot"
          git config user.email "73985391+diablomike20@users.noreply.github.com"
          git add -A
          git commit -m "RE: rename recovery-intermediate to openwrt-intermediate"
          git push origin HEAD:cudy-openwrt-intermediate
