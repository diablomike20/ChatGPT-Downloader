name: RE Cudy Dev Beta Lead Harvest

on:
  push:
    branches: [cudy-dev-beta]
    paths:
      - "scripts/dev-beta/RE_cudy_dev_harvest.py"
      - ".github/workflows/RE-cudy-dev-beta-harvest.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cudy-dev-beta
          fetch-depth: 0

      - name: Scan Cudy dev/private firmware traces
        run: python3 scripts/dev-beta/RE_cudy_dev_harvest.py

      - name: Publish textual evidence
        shell: bash
        run: |
          set -e
          rm -rf analysis/dev-beta/harvest
          mkdir -p analysis/dev-beta/harvest
          cp -a fu_7-CUDY-DEV-HARVEST/. analysis/dev-beta/harvest/
          git config user.name "OpenCudy Dev-Beta Bot"
          git config user.email "73985391+diablomike20@users.noreply.github.com"
          git add analysis/dev-beta/harvest
          git diff --cached --quiet && exit 0
          git commit -m "RE: update Cudy dev-beta lead harvest"
          git push origin HEAD:cudy-dev-beta

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RE-CUDY-DEV-BETA-HARVEST
          retention-days: 30
          path: fu_7-CUDY-DEV-HARVEST/**
