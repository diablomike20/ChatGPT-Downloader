name: TEMP Import Classified Cudy Firmware

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/TEMP-import-classified-cudy-firmware.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch migration staging from Website-downloader
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/website-downloader
          git clone --depth 1 --branch fu_7-cudy-cdn-index             https://github.com/diablomike20/Website-downloader.git /tmp/website-downloader
          test -f /tmp/website-downloader/MIGRATION-STAGING/SUMMARY.json
          cat /tmp/website-downloader/MIGRATION-STAGING/SUMMARY.json

      - name: Import beta branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin cudy-beta
          git checkout cudy-beta
          mkdir -p firmware/cudy/beta
          rm -rf firmware/cudy/beta/firmware
          cp -a /tmp/website-downloader/MIGRATION-STAGING/beta/firmware firmware/cudy/beta/
          cp /tmp/website-downloader/MIGRATION-STAGING/beta/MANIFEST.csv firmware/cudy/beta/RE-CUDY-BETA-MANIFEST.csv
          cp /tmp/website-downloader/MIGRATION-STAGING/beta/SHA256SUMS.txt firmware/cudy/beta/RE-CUDY-BETA-SHA256SUMS.txt
          cat > firmware/cudy/beta/README.md <<'EOF'
          # Cudy beta firmware archive

          Actual beta/test/RC firmware payloads recovered from the historical FU7 clean firmware archive.
          Provenance and SHA-256 values are in the manifest files.
          EOF
          git add firmware/cudy/beta
          if ! git diff --cached --quiet; then
            git config user.name "OpenCudy Firmware Migration Bot"
            git config user.email "73985391+diablomike20@users.noreply.github.com"
            git commit -m "RE: import classified Cudy beta firmware payloads"
            git push origin HEAD:cudy-beta
          fi

      - name: Import dev support branch
        shell: bash
        run: |
          set -euo pipefail
          git checkout main
          git fetch origin cudy-dev-support
          git checkout cudy-dev-support
          mkdir -p firmware/cudy/dev-support
          rm -rf firmware/cudy/dev-support/firmware
          cp -a /tmp/website-downloader/MIGRATION-STAGING/dev-support/firmware firmware/cudy/dev-support/
          cp /tmp/website-downloader/MIGRATION-STAGING/dev-support/MANIFEST.csv firmware/cudy/dev-support/RE-CUDY-DEV-SUPPORT-MANIFEST.csv
          cp /tmp/website-downloader/MIGRATION-STAGING/dev-support/SHA256SUMS.txt firmware/cudy/dev-support/RE-CUDY-DEV-SUPPORT-SHA256SUMS.txt
          cat > firmware/cudy/dev-support/README.md <<'EOF'
          # Cudy dev / support-private firmware archive

          Development, internal, support-delivered, cellular-dev and support sysupgrade payloads.
          These are not classified as normal public stable releases.
          EOF
          git add firmware/cudy/dev-support
          if ! git diff --cached --quiet; then
            git config user.name "OpenCudy Firmware Migration Bot"
            git config user.email "73985391+diablomike20@users.noreply.github.com"
            git commit -m "RE: import classified Cudy dev-support firmware payloads"
            git push origin HEAD:cudy-dev-support
          fi

      - name: Import recovery intermediate branch
        shell: bash
        run: |
          set -euo pipefail
          git checkout main
          git fetch origin cudy-recovery-intermediate
          git checkout cudy-recovery-intermediate
          mkdir -p firmware/cudy/recovery-intermediate
          rm -rf firmware/cudy/recovery-intermediate/firmware
          cp -a /tmp/website-downloader/MIGRATION-STAGING/recovery-intermediate/firmware firmware/cudy/recovery-intermediate/
          cp /tmp/website-downloader/MIGRATION-STAGING/recovery-intermediate/MANIFEST.csv firmware/cudy/recovery-intermediate/RE-CUDY-RECOVERY-INTERMEDIATE-MANIFEST.csv
          cp /tmp/website-downloader/MIGRATION-STAGING/recovery-intermediate/SHA256SUMS.txt firmware/cudy/recovery-intermediate/RE-CUDY-RECOVERY-INTERMEDIATE-SHA256SUMS.txt
          cat > firmware/cudy/recovery-intermediate/README.md <<'EOF'
          # Cudy recovery / intermediate firmware archive

          Recovery, intermediary, transitional and OpenWrt bridge/system-acceptance images.
          These are intentionally isolated from beta/dev and normal stable firmware.
          EOF
          git add firmware/cudy/recovery-intermediate
          if ! git diff --cached --quiet; then
            git config user.name "OpenCudy Firmware Migration Bot"
            git config user.email "73985391+diablomike20@users.noreply.github.com"
            git commit -m "RE: import classified Cudy recovery-intermediate firmware payloads"
            git push origin HEAD:cudy-recovery-intermediate
          fi
