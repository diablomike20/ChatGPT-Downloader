name: RE Migrate FU7 Firmware Tooling

on:
  push:
    branches: [cudy-dev-beta]
    paths:
      - ".github/workflows/RE-migrate-fu7-firmware-tooling.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cudy-dev-beta
          fetch-depth: 0

      - name: Copy firmware-specific FU7 tooling as inactive legacy material
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/website-downloader
          git clone --depth 1 --branch fu_7-cudy-cdn-index             https://github.com/diablomike20/Website-downloader.git /tmp/website-downloader

          rm -rf legacy/FU7
          mkdir -p legacy/FU7/workflows legacy/FU7/scripts legacy/FU7/handoff

          python3 - <<'PY'
          import pathlib,re,shutil
          src=pathlib.Path("/tmp/website-downloader")
          dst=pathlib.Path("legacy/FU7")
          rx=re.compile(r"(beta|dev|firmware|recovery|intermediate|support|zerotier|p2|rg500|r700|wr3000|tr1200)",re.I)

          copied=[]
          for p in (src/".github/workflows").glob("*.yml"):
              if p.name.startswith(("fu_7-","RE-")) and rx.search(p.name):
                  q=dst/"workflows"/p.name
                  shutil.copy2(p,q);copied.append(str(q))
          for p in (src/"scripts").glob("*"):
              if p.is_file() and p.name.startswith(("fu_7_","RE_")) and rx.search(p.name):
                  q=dst/"scripts"/p.name
                  shutil.copy2(p,q);copied.append(str(q))

          for rel in [
              "handoff/Firmware-Unlock-8/fu_7-ARTIFACT-INDEX.md",
              "handoff/Firmware-Unlock-8/fu_7-PROJECT-MASTER-COMPLETE.md",
              "handoff/Firmware-Unlock-8/fu_7-SOURCE-CATALOG.md",
          ]:
              p=src/rel
              if p.exists():
                  q=dst/"handoff"/p.name
                  shutil.copy2(p,q);copied.append(str(q))

          (dst/"RE-MIGRATED-FILES.txt").write_text("\n".join(sorted(copied))+"\n")
          (dst/"README.md").write_text(
              "# FU7 firmware-tooling archive\n\n"
              "Inactive copy migrated from diablomike20/Website-downloader, branch "
              "fu_7-cudy-cdn-index. These workflow YAML files are intentionally stored "
              "outside .github/workflows so they do not execute automatically.\n"
          )
          print("COPIED",len(copied))
          PY

      - name: Commit migrated legacy tooling
        shell: bash
        run: |
          set -e
          git config user.name "OpenCudy Migration Bot"
          git config user.email "73985391+diablomike20@users.noreply.github.com"
          git add legacy/FU7
          git diff --cached --quiet && exit 0
          git commit -m "RE: archive migrated FU7 firmware tooling"
          git push origin HEAD:cudy-dev-beta
